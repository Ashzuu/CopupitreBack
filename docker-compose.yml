services:
  copupitre-db:
    image: postgres:16-alpine
    container_name: copupitre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-copupitre}
      POSTGRES_USER: ${DB_USER:-copupitre}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-copupitre}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-copupitre} -d $${POSTGRES_DB:-copupitre}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - copupitre-net

  copupitre-back:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copupitre-back
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_HOST: copupitre-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-copupitre}
      DB_USER: ${DB_USER:-copupitre}
      DB_PASSWORD: ${DB_PASSWORD:-copupitre}
      DB_SCHEMA: ${DB_SCHEMA:-main}
      JWT_SECRET: ${JWT_SECRET:-defaultSecretKeyThatIsVeryLongAndSecureEnoughForHS256AlgorithmToBeValid123!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      LOG_PATH: /app/logs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost:4000,http://localhost}
    volumes:
      - ./logs:/app/logs
    depends_on:
      copupitre-db:
        condition: service_healthy
    networks:
      - copupitre-net

volumes:
  postgres_data:
    name: copupitre_postgres_data

networks:
  copupitre-net:
    name: copupitre-network
    driver: bridge
