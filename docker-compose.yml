services:
  copupitre-back:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copupitre-back
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-40080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-copupitre}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_SCHEMA: ${DB_SCHEMA:-main}
      JWT_SECRET: ${JWT_SECRET:-defaultSecretKeyThatIsVeryLongAndSecureEnoughForHS256AlgorithmToBeValid123!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      LOG_PATH: /app/logs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost:40000,http://localhost:4000,http://localhost}
    volumes:
      - ./logs:/app/logs
    networks:
      - copupitre-net

networks:
  copupitre-net:
    name: copupitre-network
    driver: bridge
