services:
  db:
    image: postgres:16-alpine
    container_name: copupitre-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-copupitre}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_EXPOSED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-copupitre}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy

  backend:
    build: .
    container_name: copupitre-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-40080}:8080"
    env_file:
      - .env
    environment:
      # Surcharge DB_HOST pour cibler le conteneur 'db' au sein du réseau Docker
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy

volumes:
  postgres_data:

networks:
  proxy:
    external: true
