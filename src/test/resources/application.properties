spring.application.name=CopupitreBackTest
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS main
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
server.servlet.context-path=/api

jwt.secret=defaultSecretKeyThatIsVeryLongAndSecureEnoughForHS256AlgorithmToBeValid123!
jwt.expiration=86400000

# Logs test configuration (stored under target/logs)
copupitre.logging.path=target/logs
logging.file.path=${copupitre.logging.path}
logging.file.name=${logging.file.path}/copupitre-test.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.ashzuu.project.copupitreback=INFO
