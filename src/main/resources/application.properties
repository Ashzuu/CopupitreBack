spring.application.name=CopupitreBack
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.servlet.context-path=/api

jwt.secret=${JWT_SECRET:defaultSecretKeyThatIsVeryLongAndSecureEnoughForHS256AlgorithmToBeValid123!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# === CONFIGURATION CORS ===
# Liste des origines autorisees (separees par des virgules) pour autoriser le frontend conteneurise
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4000,http://localhost}

# === CONFIGURATION DES LOGS SERVEUR ===
# Emplacement dedie des fichiers de logs (modifiable ici ou via la variable d'environnement LOG_PATH)
copupitre.logging.path=${LOG_PATH:logs}
logging.file.path=${copupitre.logging.path}
logging.file.name=${logging.file.path}/copupitre.log

# Formatage structure traditionnel des logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Politique de rotation des logs (Rolling policy quotidienne et par taille)
logging.logback.rollingpolicy.file-name-pattern=${logging.file.path}/archived/copupitre-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Niveaux de journalisation
logging.level.root=INFO
logging.level.ashzuu.project.copupitreback=INFO
logging.level.ashzuu.project.copupitreback.client=INFO
